# Immutable local recovery overlay. The corresponding :prime images must be
# tagged from the ACTUAL running containers before rolling forward.
# Docker images are not stored in Git. See docs/prime-recovery-point.md.
# Use with docker-compose.prime.base.yml and --no-build --no-deps.
services:
  api:
    image: ai-service-agent-api:prime
  web:
    image: ai-service-agent-web:prime
  nginx:
    image: ai-service-agent-nginx:prime
  postgres:
    image: ai-service-agent-postgres:prime
  redis:
    image: ai-service-agent-redis:prime
  n8n:
    image: ai-service-agent-n8n:prime
  gotenberg:
    image: ai-service-agent-gotenberg:prime

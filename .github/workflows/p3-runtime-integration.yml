name: P3 runtime integration smoke

on:
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "infra/**"
      - "docker-compose.yml"
      - "docker-compose.prime.base.yml"
      - "docker-compose.prime.yml"
      - "scripts/save-prime.ps1"
      - "scripts/p3-integration-smoke.sh"
      - ".github/workflows/p3-runtime-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_DB: ai_service_agent
      POSTGRES_PASSWORD: ci-p3-owner-disposable-only
      POSTGRES_APP_PASSWORD: ci-p3-runtime-disposable-only
      FOUNDRY_PROJECT_ENDPOINT: https://ci.example.services.ai.azure.com/api/projects/ci
      FOUNDRY_AGENT_NAME: ci-sara-agent
      FOUNDRY_AGENT_VERSION: "1"
      PUBLIC_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile API and Next.js customer UI
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate P4 lead authorization safety offline
        run: node scripts/check-p4-lead-bridge.mjs
      - name: Validate quotation and PDF safety offline
        run: node scripts/check-p4-quotation.mjs
      - name: Validate Node P5 2Checkout OTP/payment/invoice safety offline
        run: node scripts/check-p5-2checkout.mjs
      - name: Validate declined-payment retries and private demo contract gates
        run: node scripts/check-payment-retry-contract.mjs
      - name: Validate contract number, quote/invoice references and private n8n registry
        run: node scripts/check-contract-registry.mjs
      - name: Validate contract document compatibility and one-shot recovery
        run: node scripts/check-contract-document-recovery.mjs
      - name: Validate quote OTP synthetic recipient and shared n8n Data Table contract
        run: node scripts/check-quote-mock-otp.mjs
      - name: Validate detailed invoice scope, private Emirates ID and renderer gate
        run: node scripts/check-invoice-detailed-pdf.mjs
      - name: Validate tolerant upload metadata and strict document signatures
        run: node scripts/check-purchase-document-metadata.mjs
      - name: Validate chat journey OTP recovery and duplicate-dispatch guards
        run: node scripts/check-chat-journey-state.mjs
      - name: Validate direct activity replies avoid the repeated-question loop
        run: node scripts/check-chat-activity-recovery.mjs
      - name: Validate natural conversation and structured fact recovery
        run: node scripts/check-natural-conversation-facts.mjs
      - name: Validate safe reconciliation of existing gateway orders
        run: node scripts/check-payment-reconciliation.mjs
      - name: Validate existing checkout URL recovery without new gateway orders
        run: node scripts/check-payment-checkout-link.mjs
      - name: Validate SSE milestone notices and fail-safe persistence
        run: node scripts/check-sse-lifecycle-notifications.mjs
      - name: Validate bounded multi-ticket worker concurrency
        run: node scripts/check-turn-worker-concurrency.mjs
      - name: Validate Foundry per-request rate-limit recovery without tool replay
        run: node scripts/check-foundry-rate-control.mjs
      - name: Check action deduplication and composer layout
        run: node scripts/check-chat-action-layout.mjs
      - name: Check natural workflow handoff through sandbox invoice
        run: node scripts/check-natural-action-handoff.mjs
      - name: Check payment gateway return and two-second popup close
        run: node scripts/check-payment-return-page.mjs
      - name: Validate Compose and Nginx-only ingress
        run: |
          docker compose config --quiet
          docker compose config --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["services"]["nginx"]["ports"])==1; assert all(not s.get("ports") for n,s in d["services"].items() if n!="nginx")'
      - name: Validate prime recovery Compose and pinned image tags
        run: |
          docker compose -f docker-compose.prime.base.yml -f docker-compose.prime.yml config --quiet
          docker compose -f docker-compose.prime.base.yml -f docker-compose.prime.yml config --format json | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; assert all(s[k]["image"]=="ai-service-agent-"+k+":prime" for k in ("api","web","nginx"))'
      - name: Parse prime capture PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/save-prime.ps1").Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Host; exit 1 }
      - name: Start isolated integration containers
        run: bash scripts/p0-smoke.sh
      - name: Exercise guest ticket to durable message and SSE
        run: bash scripts/p3-integration-smoke.sh
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=140 migrate postgres api nginx || true
      - name: Remove disposable database volumes
        if: always()
        run: docker compose down -v --remove-orphans || true

name: Gemini G1 live File Search compatibility (manual / billable)
on:
  # workflow_dispatch generally requires this workflow on the default branch.
  # The experiment must not modify main, so expose a branch-local opt-in path.
  push:
    branches:
      - experiment/gemini-file-search-poc
  workflow_dispatch:
    inputs:
      model:
        description: "Available Gemini File Search model ID"
        required: true
        default: "gemini-3.8-flash"
        type: string

permissions:
  contents: read

jobs:
  g1-live:
    # Never run a billable test on a normal push. Only a deliberate opt-in
    # marker on the experiment HEAD (or manual dispatch on that exact branch).
    if: >-
      github.ref == 'refs/heads/experiment/gemini-file-search-poc' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[G1-LIVE-OPT-IN]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_G1_MODEL_ID: ${{ inputs.model || 'gemini-3.8-flash' }}
      GEMINI_G1_ALLOW_BILLABLE_RUN: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/gemini-file-search-poc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require configured Gemini API key
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'G1_BLOCKED: configure GEMINI_API_KEY secret'
            exit 1
          fi
      - name: Install isolated experimental dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Gemini adapter and provider modules
        run: npm run build --workspace @ai-service-agent/api
      - name: Run real synthetic File Search indexing, citation and function test
        run: node scripts/gemini-g1-live.mjs

name: Gemini G0 frozen contracts
on:
  push:
    branches:
      - experiment/gemini-file-search-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g0-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # This repo has no root package-lock.json. The G0 contract uses no
      # external TypeScript imports, so compile it with a pinned isolated tsc.
      - name: Compile contract with compile-time denial tests
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p packages/contracts/tsconfig.gemini.json
      - name: Assert experiment-only static G0 invariants
        run: node scripts/check-gemini-g0.mjs

name: Gemini P7 integrated-source checks
on:
  push:
    branches: [experiment/gemini-file-search-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies from experiment manifests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build existing API with integrated feature sources
        run: npm run build --workspace @ai-service-agent/api
      - name: Run P3 knowledge tests against compiled API
        run: node --test services/api/src/knowledge/knowledge.test.mjs
      - name: Run P4 grounding tests against compiled API
        run: node --test services/api/src/grounding/__tests__/grounding.test.mjs

  independent-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspaces
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build shared contract package
        run: npm run build --workspace @ai-service-agent/contracts
      - name: Typecheck and compile standalone P1 adapter
        run: npx tsc -p services/api/src/gemini/tsconfig.p1.json --noEmit false --outDir /tmp/gemini-p1-dist
      - name: Run P1 standalone offline tests
        run: node --test /tmp/gemini-p1-dist/services/api/src/gemini/adapter.test.js
      - name: Validate manual G1 live probe syntax without credentials
        run: node --check scripts/gemini-g1-live.mjs
      - name: Run P5 offline workflow adapter
        run: node --experimental-transform-types --test services/api/src/integrations/gemini-n8n/adapter.test.mjs
      - name: Run P6 offline harness (not application certification)
        run: node scripts/check-gemini-certification.mjs --mode=offline
      - name: Check P2 migration validation script syntax
        run: bash -n infra/postgres/gemini-p2-validate.sh

  g0-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify frozen contract
        run: npm exec --yes --package=typescript@5.9.3 -- tsc -p packages/contracts/tsconfig.gemini.json
      - name: Verify isolation and policy
        run: node scripts/check-gemini-g0.mjs

  docker-build:
    name: Gemini API Docker image (workspace isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate experiment Compose, separate port and volume bindings
        env:
          POSTGRES_PASSWORD: test-only-nonproduction
          POSTGRES_APP_PASSWORD: test-only-nonproduction-runtime
          GEMINI_API_KEY: ""
        run: |
          docker compose config --quiet
          docker compose config | grep -F 'ai-service-agent-gemini-postgres-data'
          docker compose config | grep -F '2000'
      - name: Build Gemini API image from repository workspace
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --progress=plain -f services/api/Dockerfile -t ai-service-agent-gemini-api:ci .

  p2-database:
    name: Gemini disposable PostgreSQL migration & catalog gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate isolated disposable database and repeatable Gemini schema
        run: bash infra/postgres/gemini-p2-validate.sh

  web-build:
    name: Gemini Next.js client and session contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build customer chat with session expiry changes
        run: npm run build --workspace @ai-service-agent/web

# Local/isolated POC ingress. Only nginx publishes host port 80.
# The customer portal and API are served from the same origin.

# The n8n editor needs an upgraded WebSocket connection for live executions.
map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Redirect /n8n to the canonical editor URL.
    location = /n8n {
        return 308 /n8n/;
    }

    # Keep all n8n webhooks, forms and MCP ingress private to the Docker
    # backend. Model/tools must only reach these through authorized Node code.
    location ~ ^/n8n/(?:webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test)(?:/|$) {
        return 404;
    }

    location /n8n/ {
        # Resolve at request time: nginx still starts when the optional n8n
        # profile is stopped. Docker embedded DNS is only on Docker networks.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $n8n_upstream n8n:5678;

        # N8N_PATH affects the browser asset base, not the backend's root
        # endpoints. Strip /n8n/ here; private Node URLs stay unchanged.
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$n8n_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /n8n;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $n8n_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/events/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

openapi: 3.1.0
info:
  title: AI Service Agent POC API Contract
  version: 0.1.0
  description: >
    Contract-first P0 definition. Public endpoints are browser-to-Node.
    Node invokes the existing published Foundry agent directly.
    These endpoints are planned and not implemented yet.
servers:
  - url: /
tags:
  - name: public
paths:
  /api/health:
    get:
      tags: [public]
      operationId: getHealth
      responses:
        "200":
          description: Node process is serving.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/agents/{agentKey}/tickets:
    post:
      tags: [public]
      operationId: createGuestTicket
      description: >
        Resolve a published Agent alias server-side and issue a ticket.
        The Node API creates or validates an opaque guest session cookie.
      parameters:
        - $ref: "#/components/parameters/agentKey"
      responses:
        "201":
          description: Created a new guest ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/tickets/{ticketId}:
    get:
      tags: [public]
      operationId: getTicket
      description: >
        Return only a ticket owned by the authenticated guest/customer
        session and its pinned Agent. Unknown and forbidden IDs must not leak details.
      parameters:
        - $ref: "#/components/parameters/ticketId"
      responses:
        "200":
          description: Authorized ticket and message history.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, messages]
                properties:
                  ticket:
                    $ref: "#/components/schemas/Ticket"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/tickets/{ticketId}/messages:
    post:
      tags: [public]
      operationId: submitCustomerMessage
      description: >
        Persist an accepted customer message before model inference;
        return 202 when durably queued. requestId is idempotent per ticket.
      parameters:
        - $ref: "#/components/parameters/ticketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, text]
              properties:
                requestId:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 12000
      responses:
        "202":
          description: Message accepted, AI turn may still be running.
          content:
            application/json:
              schema:
                type: object
                required: [ticketId, messageId, requestId, status]
                properties:
                  ticketId:
                    type: string
                    format: uuid
                  messageId:
                    type: string
                    format: uuid
                  requestId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: accepted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/events/tickets/{ticketId}:
    get:
      tags: [public]
      operationId: streamTicketEvents
      description: >
        Authenticated Server-Sent Events for one ticket. Event ID is a
        durable per-ticket ordered cursor. A reconnect can send Last-Event-ID.
        Node replays from PostgreSQL before subscribing to live notifications.
      parameters:
        - $ref: "#/components/parameters/ticketId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: Last acknowledged event cursor for this ticket.
      responses:
        "200":
          description: text/event-stream with id, event and data fields.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    agentKey:
      name: agentKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    ticketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Typed application error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Ticket:
      type: object
      required: [id, number, agentKey, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        agentKey:
          type: string
        subject:
          type: [string, "null"]
        status:
          type: string
          enum: [open, awaiting_customer, processing, closed]
        createdAt:
          type: string
          format: date-time
    ChatMessage:
      type: object
      required: [id, role, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [customer, assistant]
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        sourceReferences:
          type: array
          items:
            $ref: "#/components/schemas/SourceReference"
    SourceReference:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
        title:
          type: [string, "null"]
        uri:
          type: [string, "null"]
        revision:
          type: [string, "null"]
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: [string, "null"]

name: ai-service-agent

services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks: [app]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      NODE_ENV: production
    networks: [app]
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      AZURE_CONFIG_DIR: /home/app/.azure
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT:-}
      FOUNDRY_AGENT_NAME: ${FOUNDRY_AGENT_NAME:-anfz-sara01-agent}
      FOUNDRY_AGENT_VERSION: ${FOUNDRY_AGENT_VERSION:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - azure-cli-auth:/home/app/.azure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_service_agent}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./infra/postgres/002_intents_and_ticket_facts.sql:/docker-entrypoint-initdb.d/002_intents_and_ticket_facts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-ai_service_agent}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [app]
    restart: unless-stopped

  n8n:
    profiles: ["workflows"]
    image: docker.n8n.io/n8nio/n8n:stable
    environment:
      N8N_HOST: n8n
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [app]
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  n8n-data:
  azure-cli-auth:
